apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-task-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-task-app
  template:
    metadata:
      labels:
        app: flask-task-app
    spec:
      containers:
      - name: flask-task-app
        image: your-dockerhub-username/flask-task-app
        ports:
        - containerPort: 5000


---
apiVersion: v1
kind: Service
metadata:
  name: flask-task-service
spec:
  type: NodePort
  selector:
    app: flask-task-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30007
