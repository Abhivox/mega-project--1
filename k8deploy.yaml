apiVersion: apps/v1
kind: Deployment
metadata:
  name: mega-project-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mega-project-1
  template:
    metadata:
      labels:
        app: mega-project-1
    spec:
      containers:
      - name: mega-project-1
        image: abhi13055/megaproject1
        ports:
        - containerPort: 5000


---
apiVersion: v1
kind: Service
metadata:
  name: flask-task-service
spec:
  type: NodePort
  selector:
    app: flask-task-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30007

