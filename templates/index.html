<!DOCTYPE html>
<html>
<head>
    <title>Flask Task App</title>
</head>
<body>
    <h2>Task Manager</h2>
    <form method="POST">
        <input type="text" name="task" placeholder="Enter task" required>
        <button type="submit">Add Task</button>
    </form>
    <ul>
        {% for task in tasks %}
        <li>{{ task[1] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
